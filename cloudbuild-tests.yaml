steps:
  #
  # Unit Tests
  #

  - name: 'gcr.io/$PROJECT_ID/android:35'
    id: unit_tests
    args: [ "./gradlew", "testProdReleaseUnitTest" ]
    env:
      - 'TERM=dumb'
      - 'JAVA_TOOL_OPTIONS="-Xmx4g"'
      - 'GRADLE_USER_HOME=/build_cache/.gradle'
      - 'GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=8 -Dkotlin.incremental=false"'
      - 'BRANCH_NAME=$BRANCH_NAME'

  #
  # Store the unit test reports

  #- name: 'gcr.io/cloud-builders/gsutil'
  #  id: store_unit_test_reports
  #  args: [ '-q', 'cp', '-r', 'app/build/reports/tests/testProdReleaseUnitTest/*', 'gs://${_UNIT_TESTS_BUCKET}/$BRANCH_NAME-$BUILD_ID/' ]
  #  script: |
  #    #!/usr/bin/env bash
  #    echo "Test reports available at https://storage.googleapis.com/${_UNIT_TESTS_BUCKET}/${BRANCH_NAME}-${BUILD_ID}/index.html"
  #  waitFor: [ 'unit_tests' ]

artifacts:
  objects:
    location: 'gs://${_UNIT_TESTS_BUCKET}/$BRANCH_NAME-$BUILD_ID/'
    paths: [ 'app/build/reports/tests/testProdReleaseUnitTest/*' ]
