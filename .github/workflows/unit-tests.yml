name: Unit Tests

on:
  pull_request:
    branches:
      - develop
      - main
      - master
      - ci_test
  workflow_dispatch:

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Google Services Configuration
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Writing google-services.json from repository secret..."
            # Support both base64-encoded and raw json
            if echo "$GOOGLE_SERVICES_JSON" | base64 --decode >/dev/null 2>&1; then
              echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
            else
              echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            fi
          else
            echo "No GOOGLE_SERVICES_JSON secret found. Generating mock google-services.json for compilation/tests..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "travel-dummy",
              "storage_bucket": "travel-dummy.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "travel.vola.android"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "dummy_api_key"
                  }
                ],
                "services": {
                  "analytics_service": {
                    "status": 1
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY || 'mock_maps_api_key' }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET || 'mock_client_secret' }}
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dkotlin.incremental=false"
        run: ./gradlew testProdReleaseUnitTest

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testProdReleaseUnitTest/
          retention-days: 14
